name: one-time-event-cache-hot-path
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, '[bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch event cache hot path
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/event/[id].tsx')
          s = p.read_text()
          old = 'import { getCachedEventDetail, setCachedEventDetail } from "../../lib/event-cache";'
          new = 'import { getCachedEventDetail, getCachedEventDetailSync, setCachedEventDetail } from "../../lib/event-cache";'
          if old in s:
              s = s.replace(old, new, 1)
          marker = '  const [storedBackgroundImage, setStoredBackgroundImage] = useState<string | null>(backgroundImage);'
          replacement = marker + '\n  // Seed the first render from the in-memory event cache. This prevents the\n  // placeholder Event Name / 0 people / 0 photos state on repeat opens.\n  const initialCachedDetail = getCachedEventDetailSync(String(id));'
          if marker in s and 'const initialCachedDetail = getCachedEventDetailSync' not in s:
              s = s.replace(marker, replacement, 1)
          s = s.replace('  const [event, setEvent] = useState<any>(null);', '  const [event, setEvent] = useState<any>(initialCachedDetail?.event ?? null);', 1)
          s = s.replace('  const [photos, setPhotos] = useState<any[]>([]);', '  const [photos, setPhotos] = useState<any[]>(initialCachedDetail?.photos ?? []);', 1)
          s = s.replace('  const [people, setPeople] = useState<any[]>([]);', '  const [people, setPeople] = useState<any[]>(initialCachedDetail?.people ?? []);', 1)
          p.write_text(s)

          p = Path('lib/app-context.tsx')
          s = p.read_text()
          s = s.replace('import { getCachedEvents, setCachedEvents, type CachedEventSummary } from "./event-cache";', 'import { getCachedEvents, setCachedEvents, setCachedEventDetail, type CachedEventSummary } from "./event-cache";', 1)
          old = '''    await setCachedEvents(sessionId, enriched);\n    if (mountedRef.current) setEvents(enriched);'''
          new = '''    await setCachedEvents(sessionId, enriched);\n\n    // Warm the detail cache from the same dataset already fetched for the\n    // home/events lists. Event screens can therefore render real cached data\n    // immediately instead of starting from an empty placeholder state.\n    const participantDetailsByEvent = new Map<string, any[]>();\n    for (const row of participantRows ?? []) {\n      if (!row.event_id) continue;\n      const list = participantDetailsByEvent.get(row.event_id) ?? [];\n      list.push(row);\n      participantDetailsByEvent.set(row.event_id, list);\n    }\n    const photoDetailsByEvent = new Map<string, any[]>();\n    for (const row of photoRows ?? []) {\n      if (!row.event_id) continue;\n      const list = photoDetailsByEvent.get(row.event_id) ?? [];\n      list.push(row);\n      photoDetailsByEvent.set(row.event_id, list);\n    }\n    await Promise.all((eventRows ?? []).map((row) =>\n      setCachedEventDetail(row.id, {\n        event: row,\n        photos: photoDetailsByEvent.get(row.id) ?? [],\n        people: participantDetailsByEvent.get(row.id) ?? [],\n      }),\n    ));\n\n    if (mountedRef.current) setEvents(enriched);'''
          if old not in s:
              raise SystemExit('Expected app-context cache block was not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/event/[id].tsx' lib/app-context.tsx
          git diff --cached --quiet && exit 0
          git commit -m '[bot] Fix event cache first-render hot path'
          git push
