name: Apply event cache implementation

on:
  push:
    paths:
      - "scripts/apply-event-cache.js"
      - ".github/workflows/apply-event-cache.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply implementation
        run: node scripts/apply-event-cache.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/event-cache.ts lib/app-context.tsx 'app/event/[id].tsx' scripts/apply-event-cache.js .github/workflows/apply-event-cache.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add local-first event caching"
          git push
