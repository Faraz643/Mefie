name: Security and Flow Tests

on:
  push:
    branches:
      - main
      - "benchmark/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Static security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm install
      - run: npm run test:security:static

  integration:
    name: Supabase security and flow integration tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MEFIE_SECURITY_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm install
      - name: Check integration-test configuration
        id: config
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase integration secrets are not configured; live security tests were skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run live security and flow tests
        if: steps.config.outputs.configured == 'true'
        run: npm run test:security:integration

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm install
      - run: npm run typecheck
